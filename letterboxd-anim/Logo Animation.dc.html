  <script>window.OM_SCENES = '[{"name":"Logo","dur":2,"nat":2.2},{"name":"ZoomOut","dur":1.3,"nat":1.4},{"name":"Word","dur":1.6,"nat":2},{"name":"Hold","dur":4,"nat":1.5}]';</script>
  <script>window.OM_PLAYBACK = '{"mode":"loop"}';try{localStorage.removeItem('animstage:t');}catch(e){}

  }/*EDITMODE-END*/;</script>
