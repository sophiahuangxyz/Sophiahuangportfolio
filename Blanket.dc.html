<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  html, body { margin: 0; padding: 0; }
</style>
</helmet>
<div style="position: relative; width: 100%; height: 100%; min-height: 200px; overflow: hidden; background: #2F60D4">
  <canvas ref="{{ canvasRef }}" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none"></canvas>
  <div style="position: absolute; left: 0; right: 0; top: 0; justify-content: center; padding: 16px; pointer-events: none; display: {{ glErrorDisplay }}">
    <div style="font: 12px/1.5 ui-monospace, Menlo, monospace; color: #FFFFFF">This piece needs WebGL2 with float render targets.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1558, &quot;height&quot;: 538 },
  &quot;sound&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Feel&quot; },
  &quot;peach&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 0, &quot;min&quot;: 0, &quot;max&quot;: 1, &quot;step&quot;: 0.01, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Look&quot; },
  &quot;depth&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 1.15, &quot;min&quot;: 0.4, &quot;max&quot;: 2.5, &quot;step&quot;: 0.05, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Look&quot; },
  &quot;blueShadow&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#0042DB&quot;, &quot;options&quot;: [&quot;#0042DB&quot;, &quot;#00308F&quot;, &quot;#1B2FA8&quot;, &quot;#2545C7&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Blue colors&quot; },
  &quot;blueHighlight&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#2F60D4&quot;, &quot;options&quot;: [&quot;#2F60D4&quot;, &quot;#4A77E0&quot;, &quot;#5E8AEA&quot;, &quot;#3B6BD9&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Blue colors&quot; },
  &quot;peachShadow&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#FBDECF&quot;, &quot;options&quot;: [&quot;#FBDECF&quot;, &quot;#EFACAC&quot;, &quot;#F5C9BC&quot;, &quot;#E8B4A6&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Peach colors&quot; },
  &quot;peachHighlight&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#FFEEDA&quot;, &quot;options&quot;: [&quot;#FFEEDA&quot;, &quot;#FBDECF&quot;, &quot;#FFE8D6&quot;, &quot;#FFF2E2&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Peach colors&quot; },
  &quot;peachSheen&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#FFF6EC&quot;, &quot;options&quot;: [&quot;#FFF6EC&quot;, &quot;#FFFBF5&quot;, &quot;#FFEEDA&quot;, &quot;#FFF0E4&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Peach colors&quot; }
}">
class Component extends DCLogic {
  state = { glErr: false };
  canvasRef = React.createRef();
  m = { x: 0.5, y: 0.45 }; sm = { x: 0.5, y: 0.45 }; pmv = { x: 0.5, y: 0.45 };
  cam = { x: 0, y: 0 }; spd = 0; lastMove = 0; press = 0; down = false;
  hasMouse = 0; raf = 0;

  componentDidMount() {
    this.peachMix = this.props.peach ?? 0;
    let ok = false;
    try { ok = this.initGL(); } catch (e) { console.error('initGL', e); this.setState({ glErr: true }); }
    if (!ok) return;
    if (this.props.sound ?? true) this.makeAudio();
    const cv = this.canvasRef.current;
    this.onMove = (e) => {
      const r = cv.getBoundingClientRect();
      if (r.width < 2 || r.height < 2) return;
      const now = performance.now();
      const nx = (e.clientX - r.left) / r.width, ny = 1 - (e.clientY - r.top) / r.height;
      if (nx < -0.2 || nx > 1.2 || ny < -0.2 || ny > 1.2) return;
      // ignore moves when another section covers the canvas (sticky hero scrolled under)
      const top = document.elementFromPoint(e.clientX, e.clientY);
      if (top && top !== cv && !cv.contains(top)) {
        // allow only elements inside the same hero container (tagline text etc.);
        // an ANCESTOR of the canvas (page section, wrapper) means the cursor is off the blanket — block it
        let hero = cv.parentElement;
        while (hero) { const p = getComputedStyle(hero).position; if (p === 'sticky' || p === 'fixed') break; hero = hero.parentElement; }
        if (!hero || !hero.contains(top)) { this.spd = 0; return; }
      }
      const dt = Math.max(now - (this._mt || now - 16), 1);
      const dpx = Math.hypot((nx - this.m.x) * r.width, (ny - this.m.y) * r.height);
      const v = dpx / dt;
      this.spd = this.spd * 0.55 + Math.min(v / 2.0, 1) * 0.45;
      this._mt = now; this.lastMove = now;
      this.m = { x: nx, y: ny };
      this.hasMouse = 1;
    };
    this.onDown = (e) => {
      if (e.button !== 0) return;
      // only thump when the click lands on the blanket or hero content above it (tagline text)
      const top = document.elementFromPoint(e.clientX, e.clientY);
      if (top && top !== cv && !cv.contains(top)) {
        let hero = cv.parentElement;
        while (hero) { const p = getComputedStyle(hero).position; if (p === 'sticky' || p === 'fixed') break; hero = hero.parentElement; }
        if (!hero || !hero.contains(top)) return;
      }
      this.down = true;
      const soundOn = this.props.sound ?? true;
      if (soundOn) {
        if (!this.ac) this.makeAudio();
        if (this.ac && this.ac.state === 'suspended') this.ac.resume();
      }
      this.thump(0.65);
      this.onMove(e);
    };
    this.onUp = () => { if (!this.down) return; this.down = false; this.spd = Math.max(this.spd, 0.45); };
    this.onResume = () => {
      if (!(this.props.sound ?? true)) return;
      if (!this.ac) this.makeAudio();
      if (this.ac && this.ac.state === 'suspended') this.ac.resume();
    };
    this.onVis = () => { if (this.au && this.ac) this.au.rustle.gain.setTargetAtTime(0, this.ac.currentTime, 0.05); };
    window.addEventListener('pointermove', this.onMove, { passive: true });
    cv.addEventListener('pointerdown', this.onDown);
    window.addEventListener('pointerdown', this.onResume);
    window.addEventListener('pointerup', this.onUp);
    document.addEventListener('visibilitychange', this.onVis);
    this.onFruitClick = () => {
      if (!this.ac || !this.au) return;
      const t = this.ac.currentTime;
      this.au.master.gain.cancelScheduledValues(t);
      this.au.master.gain.setTargetAtTime(0.4, t, 0.03);
      this.au.master.gain.setTargetAtTime(2.75, t + 0.55, 0.25);
    };
    window.addEventListener('sh-fruit-click', this.onFruitClick);
    const loop = (t) => { this.raf = requestAnimationFrame(loop); this.frame(t); };
    this.raf = requestAnimationFrame(loop);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    if (this._ro) this._ro.disconnect();
    window.removeEventListener('pointermove', this.onMove);
    if (this.canvasRef.current) this.canvasRef.current.removeEventListener('pointerdown', this.onDown);
    window.removeEventListener('pointerdown', this.onResume);
    window.removeEventListener('pointerup', this.onUp);
    document.removeEventListener('visibilitychange', this.onVis);
    window.removeEventListener('sh-fruit-click', this.onFruitClick);
    if (this.ac) this.ac.close();
  }

  makeAudio() {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ac = this.ac = new AC();
    const sr = ac.sampleRate;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 6; comp.connect(ac.destination);
    const master = ac.createGain(); master.gain.value = 2.75; master.connect(comp);
    const noiseBuf = (() => { const b = ac.createBuffer(1, 2 * sr, sr); const d = b.getChannelData(0); let b0 = 0; for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; b0 = 0.985 * b0 + 0.015 * w; d[i] = (w * 0.4 + b0 * 2.4) * 0.5; } return b; })();
    const crinkleBuf = (evPerSec, bright) => {
      const b = ac.createBuffer(1, 2 * sr, sr); const d = b.getChannelData(0);
      const pEv = evPerSec / sr;
      let i = 0;
      while (i < d.length) {
        if (Math.random() < pEv) {
          const dur = Math.floor(sr * (0.0015 + Math.random() * (bright ? 0.004 : 0.009)));
          const amp = 0.25 + Math.pow(Math.random(), 1.6) * 0.75;
          let lp = 0;
          for (let k = 0; k < dur && i + k < d.length; k++) {
            const w = Math.random() * 2 - 1;
            lp = bright ? w : (lp * 0.5 + w * 0.5);
            d[i + k] += lp * amp * Math.exp(-4.2 * k / dur);
          }
          i += dur + Math.floor(sr * 0.001);
        } else i++;
      }
      return b;
    };
    const mkSrc = (buf) => { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; };
    const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
    const rustle = ac.createGain(); rustle.gain.value = 0;
    if (pan) { rustle.connect(pan); pan.connect(master); } else rustle.connect(master);
    const fSw = ac.createBiquadFilter(); fSw.type = 'lowpass'; fSw.frequency.value = 550; fSw.Q.value = 0.4;
    const gSw = ac.createGain(); gSw.gain.value = 0.16;
    mkSrc(noiseBuf).connect(fSw); fSw.connect(gSw); gSw.connect(rustle);
    const c1 = mkSrc(crinkleBuf(22, false));
    const fC1 = ac.createBiquadFilter(); fC1.type = 'bandpass'; fC1.frequency.value = 1400; fC1.Q.value = 0.7;
    const gC1 = ac.createGain(); gC1.gain.value = 0;
    c1.connect(fC1); fC1.connect(gC1); gC1.connect(rustle);
    const c2 = mkSrc(crinkleBuf(95, true));
    const fC2 = ac.createBiquadFilter(); fC2.type = 'bandpass'; fC2.frequency.value = 2000; fC2.Q.value = 0.8;
    const gC2 = ac.createGain(); gC2.gain.value = 0;
    c2.connect(fC2); fC2.connect(gC2); gC2.connect(rustle);
    const recGain = ac.createGain(); recGain.gain.value = 0; recGain.connect(rustle);
    this.au = { rustle, pan, gSw, fSw, c1, gC1, fC1, c2, gC2, fC2, recGain, master };
    fetch('assets/blanket-rustle.mp4')
      .then((r) => { if (!r.ok) throw new Error('fetch ' + r.status); return r.arrayBuffer(); })
      .then((ab) => new Promise((res, rej) => ac.decodeAudioData(ab, res, rej)))
      .then((buf) => {
        const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
        if (buf.duration > 0.6) { src.loopStart = 0.15; src.loopEnd = buf.duration - 0.15; }
        src.connect(recGain); src.start();
        this.au.rec = src;
      })
      .catch((e) => console.error('blanket recording unavailable, using synth', e));
    fetch('assets/blanket-press.mp4')
      .then((r) => { if (!r.ok) throw new Error('fetch ' + r.status); return r.arrayBuffer(); })
      .then((ab) => new Promise((res, rej) => ac.decodeAudioData(ab, res, rej)))
      .then((buf) => { this.au.pressBuf = buf; })
      .catch((e) => console.error('press recording unavailable, using synth thump', e));
  }

  updateAudio() {
    if (!this.ac || !this.au) return;
    const on = (this.props.sound ?? true) && this.ac.state === 'running';
    const a = this.au, t = this.ac.currentTime;
    const sp = Math.min(1, this.spd);
    const tgt = on ? Math.min(1, Math.pow(sp, 0.55) * 1.15) : 0;
    a.rustle.gain.setTargetAtTime(tgt, t, tgt > (this._lg || 0) ? 0.035 : 0.16);
    this._lg = tgt;
    a.gSw.gain.setTargetAtTime(0, t, 0.1);
    a.gC1.gain.setTargetAtTime(0, t, 0.1);
    a.gC2.gain.setTargetAtTime(0, t, 0.1);
    if (a.rec) {
      a.recGain.gain.setTargetAtTime(on ? Math.min(1, Math.pow(sp, 0.55) * 1.2) * 1.35 : 0, t, 0.07);
      a.rec.playbackRate.setTargetAtTime(0.85 + sp * 0.4, t, 0.15);
    }
    a.c1.playbackRate.setTargetAtTime(0.8 + sp * 0.5, t, 0.1);
    a.c2.playbackRate.setTargetAtTime(0.85 + sp * 0.65, t, 0.1);
    a.fSw.frequency.setTargetAtTime(420 + 650 * sp, t, 0.1);
    a.fC1.frequency.setTargetAtTime(1200 + 900 * sp, t, 0.1);
    a.fC2.frequency.setTargetAtTime(1700 + 1400 * sp, t, 0.1);
    if (a.pan) a.pan.pan.setTargetAtTime(Math.max(-0.8, Math.min(0.8, (this.sm.x - 0.5) * 1.7)), t, 0.12);
  }

  thump(str) {
    if (!this.ac || !this.au || !(this.props.sound ?? true)) return;
    const ac = this.ac, a = this.au;
    if (!a.pressBuf || str < 0.3) return;
    if (a.pressG) { const og = a.pressG; og.gain.cancelScheduledValues(ac.currentTime); og.gain.setTargetAtTime(0.0001, ac.currentTime, 0.12); a.pressG = null; }
    const src = ac.createBufferSource(); src.buffer = a.pressBuf;
    src.playbackRate.value = 0.95 + Math.random() * 0.1;
    const t = ac.currentTime;
    const dur = 0.75;
    const off = Math.max(0, Math.random() * Math.max(0, a.pressBuf.duration - dur - 0.4));
    const peak = Math.min(2.4, str * 3.8);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.setTargetAtTime(peak, t, 0.055);
    g.gain.setTargetAtTime(0.0001, t + 0.22, 0.19);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200; lp.Q.value = 0.3;
    src.connect(lp); lp.connect(g); g.connect(a.master);
    src.start(t, off, dur + 0.4);
    src.stop(t + dur + 0.4);
    a.pressG = g;
  }

  initGL() {
    const cv = this.canvasRef.current;
    const gl = cv.getContext('webgl2', { antialias: false, alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
    if (!gl) { this.setState({ glErr: true }); return false; }
    const ext = gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float');
    if (!ext) { this.setState({ glErr: true }); return false; }
    this.gl = gl;
    const VS = `#version 300 es
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.0-1.0,0.0,1.0);}`;
    const NOISE = `
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vnoise(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.0-2.0*f);
float a=h21(i);float b=h21(i+vec2(1.0,0.0));float c=h21(i+vec2(0.0,1.0));float d=h21(i+vec2(1.0,1.0));
return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
float fbm(vec2 p){float v=0.0;float a=0.5;for(int i=0;i<5;i++){v+=a*vnoise(p);p=p*2.03+vec2(17.3,9.1);a*=0.5;}return v;}
float fbm3(vec2 p){float v=0.0;float a=0.5;for(int i=0;i<3;i++){v+=a*vnoise(p);p=p*2.11+vec2(7.7,3.1);a*=0.5;}return v;}`;
    const SIM_FS = `#version 300 es
precision highp float;
uniform sampler2D uPrev;uniform vec2 uRes;uniform vec2 uMouse;uniform vec2 uPMouse;uniform vec2 uVel;
uniform float uAspect;uniform float uPress;uniform float uActive;
out vec4 o;
float sdSeg(vec2 p,vec2 a,vec2 b){vec2 pa=p-a;vec2 ba=b-a;float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-7),0.0,1.0);return length(pa-ba*h);}
void main(){
 vec2 uv=gl_FragCoord.xy/uRes;
 vec2 s=uv*vec2(uAspect,1.0);
 vec2 e=1.0/uRes;
 vec2 uvS=uv;
 if(uActive>0.5){
  vec2 mm=uMouse*vec2(uAspect,1.0);
  float dm2=length(s-mm);
  float infl=exp(-dm2*dm2/0.022);
  uvS=uv-(uVel*infl*0.85)/vec2(uAspect,1.0);
 }
 vec4 c=texture(uPrev,uvS);
 float D=c.r;float V=c.g;
 float lap=texture(uPrev,uv+vec2(e.x,0.0)).r+texture(uPrev,uv-vec2(e.x,0.0)).r+texture(uPrev,uv+vec2(0.0,e.y)).r+texture(uPrev,uv-vec2(0.0,e.y)).r-4.0*D;
 float force=0.0;
 if(uActive>0.5){
  vec2 m=uMouse*vec2(uAspect,1.0);vec2 pm=uPMouse*vec2(uAspect,1.0);
  float spd=length(uVel);
  float d=sdSeg(s,pm,m);
  float r=mix(0.115,0.16,uPress);
  float g=exp(-d*d/(r*r));
  force-=g*(uPress*0.45+min(spd*14.0,0.8)*0.22);
  if(uPress>0.02){
   float dc=length(s-m);
   float ang=atan(s.y-m.y,s.x-m.x);
   float ph=fract(sin(dot(m,vec2(12.9898,78.233)))*43758.5453)*6.283;
   float rr=r*(1.15+0.18*sin(ang*3.0+ph)+0.12*sin(ang*7.0+ph*2.1));
   float q=dc-rr;
   float ring=exp(-(q*q)/(r*r*0.55));
   float pleat=0.5+0.5*sin(ang*5.0+ph+sin(ang*3.0+ph*0.7+1.7)*1.6);
   float amod=0.65+0.35*sin(ang*2.0+ph*1.3);
   force+=uPress*ring*(0.55+0.45*pleat*amod)*0.07;
  }
  if(spd>1e-6){
   vec2 dir=uVel/spd;
   vec2 ahead=m+dir*0.13;
   float d2=length(s-ahead);
   force+=exp(-d2*d2/0.021)*min(spd*16.0,0.9)*0.85;
   vec2 behind=m-dir*0.13;
   float d5=length(s-behind);
   force-=exp(-d5*d5/0.024)*min(spd*14.0,0.7)*0.30;
   vec2 side=vec2(-dir.y,dir.x);
   float d3=sdSeg(s,pm+side*0.095,m+side*0.095);
   float d4=sdSeg(s,pm-side*0.095,m-side*0.095);
   force+=(exp(-d3*d3/0.009)+exp(-d4*d4/0.009))*min(spd*15.0,0.8)*0.15;
  }
 }
 V=V*0.72+(-D*(0.06+0.10*abs(D))+lap*0.045+force*0.42);
 D=(D+V)*0.9965;
 D=clamp(D,-1.5,1.5);
 o=vec4(D,V*0.999,0.0,1.0);
}`;
    const H_FS = `#version 300 es
precision highp float;
uniform sampler2D uSim;uniform vec2 uRes;
uniform float uAspect;uniform float uTime;
out vec4 o;
${NOISE}
void main(){
 vec2 uv=gl_FragCoord.xy/uRes;
 vec2 s=uv*vec2(uAspect,1.0);
 vec2 p=s;
 float u=dot(p,vec2(0.83,0.56))*7.5+fbm(p*0.85)*3.0;
 float folds=sin(u)*0.26+sin(u*0.47+1.3)*0.16+sin(u*2.15+0.7)*0.07;
 float billow=fbm(p*0.6)*0.40;
 float cross=sin(dot(p,vec2(-0.56,0.83))*2.6+fbm(p*0.7+vec2(4.2,7.7))*2.0)*0.10;
 float H=folds+billow+cross+0.55;
 vec2 se=vec2(1.0/256.0,1.0/256.0);
 float simr=texture(uSim,uv).r*0.4+(texture(uSim,uv+vec2(se.x,0.0)).r+texture(uSim,uv-vec2(se.x,0.0)).r+texture(uSim,uv+vec2(0.0,se.y)).r+texture(uSim,uv-vec2(0.0,se.y)).r)*0.15;
 float sim=simr<0.0?-0.75*(1.0-exp(simr/0.65)):simr;
 H+=sim*0.42;
 o=vec4(H,0.0,0.0,1.0);
}`;
    const SH_FS = `#version 300 es
precision highp float;
uniform sampler2D uH;
uniform vec2 uRes;uniform vec2 uHRes;uniform vec2 uMouse;uniform vec2 uCam;
uniform float uAspect;uniform float uTime;uniform float uWarmth;uniform float uDepth;uniform float uHasMouse;uniform float uPeach;
uniform vec3 uBlueA;uniform vec3 uBlueB;uniform vec3 uPeachA;uniform vec3 uPeachB;uniform vec3 uPeachC;
out vec4 o;
${NOISE}
void main(){
 vec2 uv=gl_FragCoord.xy/uRes;
 float H0=texture(uH,uv).r;
 vec2 uvp=uv+uCam*(H0-0.55)*0.030;
 vec4 hs=texture(uH,uvp);
 vec2 e=1.0/uHRes;
 float hx1=texture(uH,uvp+vec2(e.x,0.0)).r;
 float hx0=texture(uH,uvp-vec2(e.x,0.0)).r;
 float hy1=texture(uH,uvp+vec2(0.0,e.y)).r;
 float hy0=texture(uH,uvp-vec2(0.0,e.y)).r;
 float lap=hx1+hx0+hy1+hy0-4.0*hs.r;
 vec2 slope=vec2(hx1-hx0,hy1-hy0)/(2.0*e);
 vec2 s=uvp*vec2(uAspect,1.0);
 float zs=0.14*uDepth;
 vec3 N=normalize(vec3(-slope*zs,1.0));
 float hea=fbm3(s*2.2)*0.08+0.52;
 vec3 duvA=mix(uBlueA,uPeachA,uPeach);
 vec3 duvB=mix(uBlueB,mix(uPeachB,uPeachC,hea),uPeach);
 vec3 alb=mix(duvA,duvB,hea);
 float ao=1.0-clamp(lap*45.0,0.0,0.30);
 ao*=0.86+0.14*clamp(hs.r,0.0,1.2);
 vec3 L=normalize(vec3(0.42+uCam.x*0.35,0.50+uCam.y*0.35,0.62));
 float fl=1.0;
 vec3 keyC=mix(vec3(0.68,0.76,0.96),vec3(1.16,0.79,0.46),uWarmth)*fl;
 keyC=mix(keyC,vec3(1.06,0.97,0.92)*fl,uPeach*0.75);
 vec3 ambC=mix(vec3(0.25,0.30,0.42),vec3(0.34,0.29,0.25),uWarmth*0.6);
 ambC=mix(ambC,vec3(0.52,0.335,0.335),uPeach*0.7);
 ambC=mix(ambC,vec3(0.60,0.43,0.43),uPeach*0.7);
 float dif=clamp((dot(N,L)+0.42)/1.42,0.0,1.0);
 dif=mix(dif,dif*0.88,uPeach*smoothstep(0.6,1.0,dif));
 vec3 Hv=normalize(L+vec3(0.0,0.0,1.0));
 float sp=pow(max(dot(N,Hv),0.0),14.0)*0.40*(1.0-uPeach*0.85);
 vec3 col=alb*(ambC+keyC*dif)*ao+keyC*sp;
 float crease=clamp((1.0-ao)*2.6+clamp(0.55-hs.r,0.0,1.0)*0.8+(1.0-dif)*0.35,0.0,1.0);
 col=mix(col,vec3(0.612,0.055,0.118),uPeach*crease*0.11);
 col+=keyC*pow(1.0-max(N.z,0.0),1.5)*0.30*(1.0-uPeach*0.8);
 vec2 m=uMouse*vec2(uAspect,1.0);
 float dm=length(s-m);
 col*=1.0-uHasMouse*0.13*exp(-dm*dm/0.0022);
 float vg=length((uv-0.5)*vec2(1.12,1.0));
 col*=mix(1.05,0.72,smoothstep(0.24,0.85,vg));
 col+=keyC*0.055*exp(-length(uv-vec2(0.88,0.12))*2.2)*uWarmth;
 col=col/(1.0+0.14*col);
 col+=vec3(h21(gl_FragCoord.xy)-0.5)*0.006;
 col=pow(max(col,vec3(0.0)),vec3(0.95));
 o=vec4(col,1.0);
}`;
    const sh = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error('shader:', gl.getShaderInfoLog(s)); } return s; };
    const prog = (fs) => { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error('link:', gl.getProgramInfoLog(p)); } return p; };
    this.pSim = prog(SIM_FS); this.pH = prog(H_FS); this.pSh = prog(SH_FS);
    const U = (p, n) => gl.getUniformLocation(p, n);
    this.uSim = { prev: U(this.pSim, 'uPrev'), res: U(this.pSim, 'uRes'), m: U(this.pSim, 'uMouse'), pm: U(this.pSim, 'uPMouse'), vel: U(this.pSim, 'uVel'), asp: U(this.pSim, 'uAspect'), press: U(this.pSim, 'uPress'), act: U(this.pSim, 'uActive') };
    this.uH = { sim: U(this.pH, 'uSim'), res: U(this.pH, 'uRes'), asp: U(this.pH, 'uAspect'), time: U(this.pH, 'uTime') };
    this.uSh = { h: U(this.pSh, 'uH'), res: U(this.pSh, 'uRes'), hres: U(this.pSh, 'uHRes'), m: U(this.pSh, 'uMouse'), cam: U(this.pSh, 'uCam'), asp: U(this.pSh, 'uAspect'), time: U(this.pSh, 'uTime'), warm: U(this.pSh, 'uWarmth'), depth: U(this.pSh, 'uDepth'), hasm: U(this.pSh, 'uHasMouse'), peach: U(this.pSh, 'uPeach'), blueA: U(this.pSh, 'uBlueA'), blueB: U(this.pSh, 'uBlueB'), peachA: U(this.pSh, 'uPeachA'), peachB: U(this.pSh, 'uPeachB'), peachC: U(this.pSh, 'uPeachC') };
    this.mkT = (w, h) => {
      const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, w, h);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      return { t, f, w, h };
    };
    this.simA = this.mkT(256, 256); this.simB = this.mkT(256, 256);
    this.resize();
    return true;
  }

  resize() {
    const gl = this.gl, cv = this.canvasRef.current;
    if (!this._ro) { this._needRs = true; this._ro = new ResizeObserver(() => { this._needRs = true; }); this._ro.observe(cv); }
    if (!this._needRs && this.hT) return;
    this._needRs = false;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    const w = Math.max(2, Math.floor(cv.clientWidth * dpr)), h = Math.max(2, Math.floor(cv.clientHeight * dpr));
    if (w === cv.width && h === cv.height && this.hT) return;
    cv.width = w; cv.height = h;
    if (this.hT) { gl.deleteTexture(this.hT.t); gl.deleteFramebuffer(this.hT.f); }
    this.hT = this.mkT(Math.ceil(w / 2), Math.ceil(h / 2));
  }

  frame(t) {
    const gl = this.gl; if (!gl) return;
    this.resize();
    const cv = this.canvasRef.current;
    if (cv.width < 4) return;
    const time = t / 1000;
    const aspect = cv.width / cv.height;
    this.pmv = { ...this.sm };
    this.sm.x += (this.m.x - this.sm.x) * 0.16;
    this.sm.y += (this.m.y - this.sm.y) * 0.16;
    const vel = [(this.sm.x - this.pmv.x) * aspect, this.sm.y - this.pmv.y];
    this.press += ((this.down ? 1 : 0) - this.press) * 0.25;
    if (t - this.lastMove > 50) this.spd *= 0.86;
    const ct = { x: (this.sm.x - 0.5), y: (this.sm.y - 0.5) };
    this.cam.x += (ct.x - this.cam.x) * 0.04;
    this.cam.y += (ct.y - this.cam.y) * 0.04;
    const targetPeach = this.props.peach ?? 0;
    this.peachMix += (targetPeach - this.peachMix) * 0.06;
    const warmth = 0.45 + 0.3 * this.peachMix;
    const depth = this.props.depth ?? 1.15;
    gl.useProgram(this.pSim);
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.simB.f);
    gl.viewport(0, 0, 256, 256);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.simA.t);
    gl.uniform1i(this.uSim.prev, 0);
    gl.uniform2f(this.uSim.res, 256, 256);
    gl.uniform2f(this.uSim.m, this.sm.x, this.sm.y);
    gl.uniform2f(this.uSim.pm, this.pmv.x, this.pmv.y);
    gl.uniform2f(this.uSim.vel, vel[0], vel[1]);
    gl.uniform1f(this.uSim.asp, aspect);
    gl.uniform1f(this.uSim.press, this.press);
    gl.uniform1f(this.uSim.act, this.hasMouse);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    const tmp = this.simA; this.simA = this.simB; this.simB = tmp;
    gl.useProgram(this.pH);
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.hT.f);
    gl.viewport(0, 0, this.hT.w, this.hT.h);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.simA.t);
    gl.uniform1i(this.uH.sim, 0);
    gl.uniform2f(this.uH.res, this.hT.w, this.hT.h);
    gl.uniform1f(this.uH.asp, aspect);
    gl.uniform1f(this.uH.time, time);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.useProgram(this.pSh);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, cv.width, cv.height);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.hT.t);
    gl.uniform1i(this.uSh.h, 0);
    gl.uniform2f(this.uSh.res, cv.width, cv.height);
    gl.uniform2f(this.uSh.hres, this.hT.w, this.hT.h);
    gl.uniform2f(this.uSh.m, this.sm.x, this.sm.y);
    gl.uniform2f(this.uSh.cam, this.cam.x, this.cam.y);
    gl.uniform1f(this.uSh.asp, aspect);
    gl.uniform1f(this.uSh.time, time);
    gl.uniform1f(this.uSh.warm, warmth);
    gl.uniform1f(this.uSh.depth, depth);
    gl.uniform1f(this.uSh.hasm, this.hasMouse);
    gl.uniform1f(this.uSh.peach, this.peachMix);
    const hex = (h, dflt) => {
      const m = /^#?([0-9a-f]{6})$/i.exec(h || ''); const v = m ? m[1] : dflt;
      return [parseInt(v.slice(0, 2), 16) / 255, parseInt(v.slice(2, 4), 16) / 255, parseInt(v.slice(4, 6), 16) / 255];
    };
    gl.uniform3fv(this.uSh.blueA, hex(this.props.blueShadow, '0042db'));
    gl.uniform3fv(this.uSh.blueB, hex(this.props.blueHighlight, '2f60d4'));
    gl.uniform3fv(this.uSh.peachA, hex(this.props.peachShadow, 'fbdecf'));
    gl.uniform3fv(this.uSh.peachB, hex(this.props.peachHighlight, 'ffeeda'));
    gl.uniform3fv(this.uSh.peachC, hex(this.props.peachSheen, 'fff6ec'));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    this.updateAudio();
  }

  renderVals() {
    return {
      canvasRef: this.canvasRef,
      glErrorDisplay: this.state.glErr ? 'flex' : 'none'
    };
  }
}
