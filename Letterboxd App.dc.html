          const h2 = this.state.hist || [];
          const idx2 = h2.lastIndexOf('profile');
          if (idx2 >= 0) this.go({ screen: 'profile', hist: h2.slice(0, idx2), _back: true });
          else this.go({ screen: 'profile', _back: true });
          return;
        }
        const h = this.state.hist || [];
        const idx = h.lastIndexOf('fprofile');
        if (idx >= 0) this.go({ screen: 'fprofile', hist: h.slice(0, idx), _back: true });
        else this.go({ screen: 'fprofile', _back: true });
      },
      navHomeC: (s.screen === 'home' || (s.tab === 'home' && (s.screen === 'detail' || s.screen === 'compose' || s.screen === 'profile'))) ? '#FFFFFF' : '#ACBDCE',
      navSearchC: s.screen === 'search' || (s.tab === 'search' && (s.screen === 'detail' || s.screen === 'compose')) ? '#FFFFFF' : '#ACBDCE',
      navFriendsC: s.screen === 'friends' ? '#FFFFFF' : '#ACBDCE',
      navLibC: s.screen === 'library' ? '#FFFFFF' : '#ACBDCE',

      sheet: s.sheet,
      openSheet: () => this.setState({ sheet: true, sq: '', ddOpen: false }),
      closeSheet: () => this.setState({ sheet: false }),
      sq: s.sq, setSq: e => this.setState({ sq: e.target.value }),
      sheetBrowse: !sql, sheetResults: !!sql, sResults, sheetNoResults: !!sql && sResults.length === 0,
      hasDrafts: !sql && Object.keys(s.drafts).length > 0,
      sheetDrafts: Object.keys(s.drafts).map(id => {
        const f = this.fobj(id);
        const d = s.drafts[id];
        const dtxt = (d.txt || '').trim();
        return {
          t: f.t,
          hasStars: d.rating > 0,
          stars: d.rating > 0 ? this.stars(d.rating, 11).filter(x => x.f !== '#D9D9D9') : [],
          hasHeart: !!d.fav,
          snippet: dtxt || (d.rating > 0 || d.fav ? '' : 'empty draft'),
          open: () => this.openCompose(id),
          showX: s.draftDelId === id,
          showDraftLabel: s.draftDelId !== id,
          toggleX: e => { e.stopPropagation(); this.setState(p => ({ draftDelId: p.draftDelId === id ? '' : id })); },
          del: e => {
            e.stopPropagation();
            this.setState(p => { const dd = Object.assign({}, p.drafts); delete dd[id]; return { drafts: dd, draftDelId: '' }; });
            this.showToast('Draft deleted');
          }
        };
      }),
      sheetLinks: (() => {
        const mine = s.recentIds || [];
        const defaults = s.recentsCleared ? [] : ['zoo2','smile','fnaf2','wicked2','sinners','animalfarm','kpop','weapons'];
        const ids = mine.concat(defaults.filter(x => !mine.includes(x))).slice(0, 8);
        return ids.map(id => {
          const f = this.fobj(id);
          return { name: f.t, go: () => this.openCompose(f.id) };
        });
      })(),
      hasRecents: (s.recentIds || []).length > 0 || !s.recentsCleared,
      clearRecents: () => this.setState({ recentsCleared: true, recentIds: [] }),

      toast: s.toast
    };
  }
}
</script>
